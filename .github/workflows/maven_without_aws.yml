name: maven_without_aws.yml

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn -B clean test

      - name: Package application
        run: mvn -B package -DskipTests

      - name: Build Jar file with Docker
        run: docker build -t gridshop-product-service:latest ./product-service

