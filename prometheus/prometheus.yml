global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'gridshop-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'user-service:8081'
          - 'user-service-2:8081'
          - 'product-service:8082'
          - 'product-service-2:8082'
          - 'order-service:8083'
          - 'eureka-server:8761'
